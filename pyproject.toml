[project]
name = "competition-monitoring-pipeline"
version = "0.1.0"
description = "Cost-efficient scrape, filter, deduplicate, and notify competition monitoring pipeline"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "lxml>=5.3,<6",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dateutil>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "tenacity>=9,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
browser = ["playwright>=1.46,<2"]
llm = ["openai>=1.40,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
competition-monitor = "orchestration.cli:app"

[tool.setuptools.packages.find]
include = ["config*", "ingestion*", "filtering*", "notifications*", "storage*", "orchestration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
