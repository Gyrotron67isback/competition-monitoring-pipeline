services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: competition
      POSTGRES_PASSWORD: competition
      POSTGRES_DB: competition_monitor
    ports:
      - "5432:5432"
    volumes:
      - competition_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U competition -d competition_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  competition_pgdata:
